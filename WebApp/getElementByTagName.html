<a href="https://www.google.com">Google</a>
<a href="https://www.facebook.com">Facebook</a>
<script>
    var k1=document.getElementsByTagName("a")[0].href;
    var k2=document.getElementsByTagName("a")[1].href;
    document.write("Your link is::"+k1);
    document.write("<br>Your link is::"+k2);
</script>
