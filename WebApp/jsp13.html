<script>
    function Sample() {
        n = parseInt(prompt("Enter the n value is::"))
        if (n % 2 == 0) {
            document.write("Its is even" + n)
        }
        else {
            document.write("Its is Odd" + n)
        }

    }
</script>
<button type="button" onclick="Sample()">ClickHere</button>
