<script>
         age=parseInt(prompt("Enter the age is::"))
        if(age>=60)
        {
             salary=parseInt(prompt("Enter the salary is::"))
            if(salary>=20000)
            {
                bns=salary+500
                document.write("Your salary is::",+bns);
            }
            else
            {
                bns=salary+1000;
                document.write("Your salary is::",+bns);
            }
        }
        else
        {
            document.write("Your age is low..");
        }
    </script>
