<script>
    var a1=parseInt(prompt("Enter the a1 value is::"))
    var b1=parseInt(prompt("Enter the b1 value is::"))
    document.write("Add::"+(a1+b1))
    document.write("Sub::"+(a1-b1))
    document.write("mul::"+(a1*b1))
    document.write("Div::"+(a1/b1))
    document.write("Module::"+(a1%b1))
    document.write("ReleationOperator")
    document.write("Lessthan::"+(a1<b1))
    document.write("Greather::"+(a1>b1))
    document.write("Equal::"+(a1==b1))
    document.write("LogicalAND::"+(a1>b1)&&(b1<a1))
    document.write("LogicalOR::"+(a1>b1)||(b1>a1))
    document.write("LogicalNOT::"+(!(a1>b1)))
</script>
